spring:
  application:
    name: tawassol-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/tawassol?useUnicode=true&characterEncoding=utf8&connectionTimeZone=Africa/Casablanca&forceConnectionTimeZoneToSession=true}
    username: ${DB_USER:tawassol}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    default-property-inclusion: non_absent
    time-zone: Africa/Casablanca
  threads:
    virtual:
      enabled: true

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

tawassol:
  security:
    jwt-secret: ${JWT_SECRET:}
    access-ttl: 15m
    refresh-ttl: 30d
    max-failed-attempts: 5
    lock-duration: 15m
    login-rate-per-minute: 20
    password-min-length: 12
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  hierarchy-cache-ttl: 20s
  web-url: ${WEB_URL:http://localhost:3000}
  storage:
    path: ${STORAGE_PATH:./data/files}
  bootstrap:
    admin-password: ${TAWASSOL_ADMIN_INITIAL_PASSWORD:}
    demo-password: ${TAWASSOL_DEMO_PASSWORD:}

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:true}
