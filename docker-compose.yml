# Pile complète : docker compose up --build
# Copiez .env.example en .env et renseignez les secrets avant de démarrer.
# La base de données est EXTERNE (DB_URL, DB_USER, DB_PASSWORD dans .env). Le service mysql ci-dessous n'est qu'un
# secours local : il ne démarre que avec  docker compose --profile localdb up  (et alors DB_URL doit viser mysql:3306).
name: tawassol

services:
  mysql:
    profiles: ["localdb"]
    image: mysql:8.4
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+01:00"]
    environment:
      MYSQL_DATABASE: tawassol
      MYSQL_USER: tawassol
      MYSQL_PASSWORD: ${DB_PASSWORD:-localdb}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-localdb-root}
      TZ: Africa/Casablanca
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build: ./apps/api
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      # Les dates de la base sont des heures locales marocaines sans fuseau : l'API tourne en UTC pour les lire et les écrire telles quelles.
      # (Avec le fuseau Africa/Casablanca, une heure comprise dans le changement d'heure du ramadan, ex. 02:30, ne peut pas être lue.)
      DB_URL: ${DB_URL:?DB_URL requis (base externe)}
      DB_USER: ${DB_USER:?DB_USER requis}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requis}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis (32 caractères minimum)}
      TAWASSOL_ADMIN_INITIAL_PASSWORD: ${TAWASSOL_ADMIN_INITIAL_PASSWORD:-}
      TAWASSOL_DEMO_PASSWORD: ${TAWASSOL_DEMO_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      OPENAPI_ENABLED: ${OPENAPI_ENABLED:-false}
      STORAGE_PATH: /data/files
      # Authentification par l'annuaire Active Directory (LDAPS). Le mot de passe du compte de service ne vit QUE dans .env.
      LDAP_ENABLED: ${LDAP_ENABLED:-false}
      LDAP_HOSTS: ${LDAP_HOSTS:-dc1.ad.entraide.ma,dc2.ad.entraide.ma}
      LDAP_PORT: ${LDAP_PORT:-636}
      LDAP_TLS: ${LDAP_TLS:-true}
      LDAP_CA_FILE: ${LDAP_CA_FILE:-}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-OU=USERS,OU=Entraide Nationale,DC=ad,DC=entraide,DC=ma}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-CN=svc_tawassol_ldap,OU=SERVICE_ACCOUNTS,OU=ENTRAIDE_ADMINISTRATION,DC=ad,DC=entraide,DC=ma}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      LDAP_USER_FILTER: ${LDAP_USER_FILTER:-(&(objectClass=user)(|(sAMAccountName={0})(userPrincipalName={0})(mail={0})(employeeID={0})))}
      LDAP_MATRICULE_ATTRIBUTE: ${LDAP_MATRICULE_ATTRIBUTE:-employeeID}
      TZ: UTC
    # Résolution des contrôleurs de domaine par les DNS de l'AD
    dns:
      - 172.16.10.52
      - 172.16.10.51
    volumes:
      - files_data:/data/files
      - ./certs:/certs:ro
    ports:
      - "8080:8080"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8080
      # true derrière HTTPS (production). En essai local en HTTP, mettre false dans .env.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    depends_on:
      api: { condition: service_healthy }
    ports:
      # port publié par la VM : 3000 par défaut, WEB_PORT=80 dans .env pour servir l'application sur le port 80
      - "${WEB_PORT:-3000}:3000"

volumes:
  mysql_data:
  files_data:
